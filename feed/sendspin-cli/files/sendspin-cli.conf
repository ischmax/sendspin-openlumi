# /etc/sendspin-cli.conf
# Keys are the long command-line flag names of sendspin-cli (see `sendspin-cli --help`).
# Comments start with '#' only at the beginning of a line.

# Player name shown in Music Assistant
name = openlumi-gateway

# ALSA output. Run `sendspin-cli -l` to list devices and the formats they accept.
# Try `hw:0,0` (direct) if `default` misbehaves; `plughw:0,0` lets ALSA convert rate/format.
output = default

# Jitter buffer in ms (10-2000). Raise it if you hear dropouts on Wi-Fi.
buffer-ms = 250

# Discovery is enabled in this build. Leave `server` unset so the player advertises
# _sendspin._tcp and Music Assistant can connect back to port 8928.
# For a fixed outbound connection only, use:
#   server = 192.168.1.10

# Persisted state (volume, mute, static delay) and the local control socket.
# The socket path is what lets `sendspin-cli status|pause|vol 40|...` find the daemon.
state-dir = /etc/sendspin-cli
control-socket = /var/run/sendspin-cli.sock

# Latency (ms) that this speaker adds AFTER the ALSA port; usually 0.
# static-delay = 0

# Log verbosity (see `sendspin-cli --help` for accepted values, e.g. debug)
# log-level = debug
